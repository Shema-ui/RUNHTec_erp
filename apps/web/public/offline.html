<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003DA5">
<title>Offline · RUNHTec</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F8FC; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0F172A; padding: 24px; box-sizing: border-box; }
  .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #E2E8F0; border-radius: 20px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(15,23,42,0.06); }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #475569; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  button { background: #003DA5; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="RUNHTec">
    <h1>You’re offline</h1>
    <p>The RUNHTec portal needs the internet to load your quotations, projects and invoices. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
