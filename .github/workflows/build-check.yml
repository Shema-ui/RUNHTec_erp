# Compiles the ERP frontend on work-in-progress branches (wip/*) without
# publishing anything, so changes can be checked before they reach main.
# The build output is saved to the "ci-logs" branch for review.
name: Build check

on:
  push:
    branches: ["wip/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        id: build
        continue-on-error: true
        env:
          VITE_API_URL: https://api.runhteccontractors.si
        run: |
          set -o pipefail
          npm run build --prefix apps/web 2>&1 | tee build.log

      - name: Check backend syntax
        id: server
        continue-on-error: true
        run: |
          set -o pipefail
          (for f in $(find apps/server/src -name '*.js'); do node --check "$f" || echo "SYNTAX ERROR in $f"; done) 2>&1 | tee server.log
          ! grep -q "SYNTAX ERROR" server.log

      - name: Save log to ci-logs branch
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          {
            echo "commit: $SHA"
            echo "build: ${{ steps.build.outcome }}"
            echo "server: ${{ steps.server.outcome }}"
            echo "----- build (last 200 lines) -----"
            tail -n 200 build.log || true
            echo "----- server -----"
            cat server.log || true
          } > /tmp/result.txt
          git config user.name "build-check"
          git config user.email "build-check@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/result.txt "result-$SHA.txt"
          cp /tmp/result.txt latest.txt
          git add -A
          git commit -qm "build check $SHA" || true
          git push -f origin ci-logs

      - name: Fail if build failed
        if: steps.build.outcome != 'success' || steps.server.outcome != 'success'
        run: exit 1
