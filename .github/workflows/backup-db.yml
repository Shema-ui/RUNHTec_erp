# Weekly full backup of the ERP database (every record AND every uploaded file),
# made by GitHub for free. The backup is ENCRYPTED with your own passphrase
# before it is stored, so it is safe even though this repository is public.
#
# One-time setup (see BACKUPS.md): repository Settings → Secrets and variables →
# Actions → New repository secret, add:
#   DB_HOST, DB_USER, DB_PASSWORD   (the same values as on Render)
#   BACKUP_PASSPHRASE               (a long sentence only you know — write it down!)
#
# Download a backup: Actions tab → "Database backup" → a run → Artifacts.
# Run one now: Actions → "Database backup" → Run workflow.
name: Database backup

on:
  schedule:
    - cron: "17 1 * * 0"   # Sundays 01:17 UTC (03:17 in Kigali)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT || '4000' }}
      DB_NAME: ${{ secrets.DB_NAME || 'runhtec_erp' }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          for v in DB_HOST DB_USER DB_PASSWORD BACKUP_PASSPHRASE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Backup not set up yet. Add these repository secrets:$missing (see BACKUPS.md)"
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE is too short. Use at least 16 characters (a sentence is best)."
            exit 1
          fi

      - name: Dump the database
        run: |
          sudo apt-get install -y -qq mysql-client >/dev/null 2>&1 || true
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          umask 077
          printf '[client]\npassword=%s\n' "$DB_PASSWORD" > ~/.my.cnf
          # (No --single-transaction: TiDB does not support the SAVEPOINT it uses.
          #  The backup runs at night when nobody is working.)
          mysqldump --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" \
            --ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/ssl/certs/ca-certificates.crt \
            --skip-lock-tables --no-tablespaces --column-statistics=0 \
            --set-gtid-purged=OFF --hex-blob --skip-triggers \
            --databases "$DB_NAME" > backup.sql
          rm -f ~/.my.cnf
          # Sanity check: the main tables must be in the file.
          for t in users clients quotations projects files; do
            grep -q "CREATE TABLE \`$t\`" backup.sql || { echo "::error::Table $t missing from the dump"; exit 1; }
          done
          echo "Dump size: $(du -h backup.sql | cut -f1)"

      - name: Compress and encrypt
        run: |
          gzip -9 backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.sql.gz -out "runhtec-erp-$STAMP.sql.gz.enc" -pass env:BACKUP_PASSPHRASE
          shred -u backup.sql.gz 2>/dev/null || rm -f backup.sql.gz
          ls -lh runhtec-erp-*.enc

      - uses: actions/upload-artifact@v4
        with:
          name: runhtec-erp-backup-${{ env.STAMP }}
          path: runhtec-erp-*.sql.gz.enc
          retention-days: 90
          if-no-files-found: error
